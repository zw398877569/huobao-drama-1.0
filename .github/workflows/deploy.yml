name: Build and Publish Image

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'configs/**'
      - 'scripts/**'
      - 'skills/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_MIRROR=
            NPM_REGISTRY=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only bump compose for real user pushes; skip when this workflow's own
      # auto-commit (pushed by github-actions[bot]) re-triggers a run, to avoid
      # an infinite loop.
      - name: Bump compose timestamp
        if: github.actor != 'github-actions[bot]'
        run: |
          sed -i "s|# deploy-trigger:.*|# deploy-trigger: $(date -u +%FT%TZ)|" docker-compose.yml

      - name: Commit and push compose bump
        if: github.actor != 'github-actions[bot]'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: bump compose for redeploy (${{ github.sha }})"
          file_pattern: docker-compose.yml
