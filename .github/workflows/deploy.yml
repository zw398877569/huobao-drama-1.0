name: Build and Publish Image

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=refname,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_MIRROR=
            NPM_REGISTRY=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Touch compose so Portainer Polling picks up the new image tag.
      # This is a no-op for Docker but forces a git diff Portainer can detect.
      - name: Bump compose timestamp
        run: |
          sed -i "s|# deploy-trigger:.*|# deploy-trigger: $(date -u +%FT%TZ)|" docker-compose.yml

      - name: Commit and push compose bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: bump compose for redeploy (${{ github.sha }})"
          file_pattern: docker-compose.yml
