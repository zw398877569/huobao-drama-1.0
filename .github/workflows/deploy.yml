name: Build and Publish Image

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'configs/**'
      - 'scripts/**'
      - 'skills/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ★ Sprint 39 (PM msg-20261111-168): 多架构构建 —— amd64 (现有 win 主机) + arm64 (为将来
      #   Apple Silicon 的 Mac 铺路)。同一个 tag 下两个架构都能拉到 (manifest list)。
      #   ★ binfmt 注册: GitHub 的 amd64 runner 上跑 arm64 的 RUN 步骤 (apt-get / npm) 需要
      #     注册 QEMU 的 binfmt handler, 否则会报 exec format error。
      #     注: 产出的仍然是【原生 arm64 镜像】(同样的 Dockerfile/基础镜像/apt 源), 模拟只发生在构建过程。
      - name: Set up QEMU (register binfmt handlers)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # ★ Sprint 39 (PM msg-20261111-168): 同时产出 linux/amd64 + linux/arm64。
          #   amd64 的镜像内容与改动前【完全一致】(同样的 Dockerfile / build-args / 源) → win 主机零影响。
          #   构建日志里每个步骤都带 [linux/amd64] / [linux/arm64] 前缀 → 某个架构失败时能直接看出是哪个。
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_MIRROR=
            NPM_REGISTRY=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only bump compose for real user pushes; skip when this workflow's own
      # auto-commit (pushed by github-actions[bot]) re-triggers a run, to avoid
      # an infinite loop.
      - name: Bump compose timestamp
        if: github.actor != 'github-actions[bot]'
        run: |
          sed -i "s|# deploy-trigger:.*|# deploy-trigger: $(date -u +%FT%TZ)|" docker-compose.yml

      - name: Commit and push compose bump
        if: github.actor != 'github-actions[bot]'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: bump compose for redeploy (${{ github.sha }})"
          file_pattern: docker-compose.yml
