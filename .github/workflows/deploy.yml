name: Build and Publish Image

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'configs/**'
      - 'scripts/**'
      - 'skills/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ★★ 只构建 linux/amd64（2026-11-26 起）
      #
      # ① 为什么只 amd64：
      #    唯一跑这个镜像的地方是【Intel Mac 上的 Docker】（amd64）。
      #    M3（Apple Silicon）目前只跑前端 dev server，并通过局域网连 Intel 后端，不跑这个镜像。
      #    以前用 QEMU 在 amd64 runner 上模拟编译 arm64，占了一半以上 CI 时间（~8-9 分钟）；
      #    只构建 amd64 后约 3-4 分钟。
      #
      # ② 以后要在 M3（Apple Silicon）上跑这个镜像时，恢复双架构只需两步：
      #    1) 把下面 "Build and push" 里的
      #         platforms: linux/amd64
      #       改回
      #         platforms: linux/amd64,linux/arm64
      #    2) 在 "Set up Docker Buildx" 之前【加回 QEMU 步骤】—— 因为 GitHub 的 runner 是 amd64，
      #       跑 arm64 镜像里的 RUN 步骤（apt-get / npm）需要 binfmt 注册，否则报 exec format error：
      #         - name: Set up QEMU (register binfmt handlers)
      #           uses: docker/setup-qemu-action@v3
      #           with:
      #             platforms: arm64
      #
      # ③ 恢复后要注意：ghcr 的 :latest 会变成【双架构 manifest list】（amd64 + arm64 同一个 tag），
      #    Intel 和 M3 都能直接 docker pull 到各自架构的原生镜像。
      #    不恢复时 :latest 只有 amd64 —— M3 上直接 docker pull 拿不到原生镜像（只能 --platform linux/amd64 走模拟运行）。
      #
      # ★ 只改这两处即可，其它步骤（Buildx / GHCR 登录 / tag 策略 / build-args / bump commit）都不用动。

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # ★ 只构建 linux/amd64（2026-11-26 起）。要恢复双架构：改这一行 + 加回 QEMU，
          #   完整步骤见上面 "只构建 linux/amd64" 那段备注。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_MIRROR=
            NPM_REGISTRY=
            # ★ Sprint 57 T3 (PM msg-20261123-225): 构建版本标识 (前后端同一次构建 → 逐字一致)
            #   BUILD_ID = commit sha; BUILD_TIME = 该 commit 的【提交时间】(不是"构建那一刻":
            #   同一 commit 重建多次显示同一个时间, 用户不会以为版本一直在跳)
            BUILD_ID=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only bump compose for real user pushes; skip when this workflow's own
      # auto-commit (pushed by github-actions[bot]) re-triggers a run, to avoid
      # an infinite loop.
      - name: Bump compose timestamp
        if: github.actor != 'github-actions[bot]'
        run: |
          sed -i "s|# deploy-trigger:.*|# deploy-trigger: $(date -u +%FT%TZ)|" docker-compose.yml

      - name: Commit and push compose bump
        if: github.actor != 'github-actions[bot]'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: bump compose for redeploy (${{ github.sha }})"
          file_pattern: docker-compose.yml
