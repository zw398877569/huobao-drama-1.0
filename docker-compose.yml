services:
  huobao-drama:
    image: ghcr.io/zw398877569/huobao-drama-1.0:latest
    ports:
      - "5679:5679"
    volumes:
      - ./data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml
    environment:
      - NODE_ENV=production
      - PORT=5679
    restart: unless-stopped
